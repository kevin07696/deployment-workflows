name: Deploy to Oracle Cloud Staging

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: 'Name of the service to deploy'
      image-tag:
        required: false
        type: string
        default: 'latest'
        description: 'Docker image tag to deploy'
      oracle-cloud-host:
        required: true
        type: string
        description: 'Oracle Cloud host IP (from infrastructure output)'
    secrets:
      ORACLE_CLOUD_SSH_KEY:
        required: true
      OCIR_REGION:
        required: true
      OCIR_TENANCY_NAMESPACE:
        required: true
      OCIR_USERNAME:
        required: true
      OCIR_AUTH_TOKEN:
        required: true
      DB_PASSWORD:
        required: true
      EPX_MAC_STAGING:
        required: true
      EPX_CUST_NBR:
        required: true
      EPX_MERCH_NBR:
        required: true
      EPX_DBA_NBR:
        required: true
      EPX_TERMINAL_NBR:
        required: true
      CRON_SECRET_STAGING:
        required: true

jobs:
  deploy:
    name: Deploy Application with Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Infrastructure Outputs
        run: |
          echo "=== Infrastructure Outputs Debug ==="
          echo "oracle-cloud-host: '${{ inputs.oracle-cloud-host }}'"

          # Critical validation: Ensure oracle-cloud-host is not empty
          if [ -z "${{ inputs.oracle-cloud-host }}" ]; then
            echo "❌ CRITICAL: oracle-cloud-host is EMPTY!"
            echo "This will cause SSH connectivity checks to fail."
            exit 1
          fi

          # Validate IP format (basic check)
          if ! echo "${{ inputs.oracle-cloud-host }}" | grep -E '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "⚠️ WARNING: oracle-cloud-host does not appear to be a valid IP: ${{ inputs.oracle-cloud-host }}"
          fi

          echo "✅ Infrastructure outputs validated"

      - name: Wait for SSH to be ready
        run: |
          ORACLE_HOST="${{ inputs.oracle-cloud-host }}"
          echo "⏳ Waiting for compute instance SSH to be ready..."
          echo "Target host: $ORACLE_HOST"
          max_attempts=60
          attempt=1

          # Test basic network connectivity first
          echo "Testing ICMP connectivity..."
          if ping -c 3 -W 5 "$ORACLE_HOST" > /dev/null 2>&1; then
            echo "✅ ICMP: Instance is pingable"
          else
            echo "⚠️ ICMP: Instance not responding to ping (may be normal if ICMP blocked)"
          fi

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: Checking SSH connectivity to $ORACLE_HOST:22..."

            if timeout 10 nc -z "$ORACLE_HOST" 22 2>/dev/null; then
              echo "✅ SSH port is open!"
              sleep 10
              echo "✅ SSH is ready for connections"
              exit 0
            fi

            echo "SSH not ready yet, waiting 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "❌ SSH did not become ready after $max_attempts attempts"
          exit 1

      - name: Download SSH Private Key
        uses: actions/download-artifact@v4
        with:
          name: oracle-ssh-key-staging
          path: .

      - name: Set SSH Key Permissions
        run: |
          chmod 600 oracle-staging-key
          ls -la oracle-staging-key

      - name: Wait for cloud-init to complete
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "⏳ Waiting for cloud-init to complete..."

            # Wait for cloud-init to finish (max 15 minutes)
            # Note: cloud-init may report "degraded" if apt package install fails
            # due to unavailable regional mirrors. This is OK as long as Docker
            # and PostgreSQL are installed and running (verified below).
            timeout 900 cloud-init status --wait || true

            CLOUD_INIT_STATUS=$(cloud-init status --long 2>/dev/null || echo "unknown")
            echo "Cloud-init status: $CLOUD_INIT_STATUS"

            if echo "$CLOUD_INIT_STATUS" | grep -qE "(done|degraded)"; then
              echo "✅ cloud-init finished (may have non-critical errors)"
            else
              echo "⚠️ cloud-init status uncertain, proceeding with verifications..."
              echo ""
              echo "=== Last 50 lines of cloud-init output ==="
              sudo tail -n 50 /var/log/cloud-init-output.log || true
            fi

            # Verify Docker is installed and working
            echo "🔍 Verifying Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker command not found!"
              exit 1
            fi

            if ! sudo docker version &> /dev/null; then
              echo "❌ Docker installed but not working!"
              exit 1
            fi

            echo "✅ Docker verified: $(sudo docker --version)"

            # Verify PostgreSQL container is running
            echo "🔍 Verifying PostgreSQL container..."
            if ! sudo docker ps | grep -q payment-db; then
              echo "❌ PostgreSQL container not running!"
              sudo docker ps -a
              exit 1
            fi

            # Wait for PostgreSQL to be ready
            for i in $(seq 1 30); do
              if sudo docker exec payment-db pg_isready -U payment_service > /dev/null 2>&1; then
                echo "✅ PostgreSQL is ready"
                break
              fi
              echo "Waiting for PostgreSQL... ($i/30)"
              sleep 2
            done

            # Verify application directory exists
            if [ ! -d ~/payment-service ]; then
              echo "❌ Application directory not created by cloud-init"
              exit 1
            fi

            echo "✅ All verifications passed - instance ready for deployment"

      - name: Login to Oracle Container Registry (OCIR)
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login ${{ secrets.OCIR_REGION }}.ocir.io \
            -u "${{ secrets.OCIR_USERNAME }}" \
            --password-stdin

      - name: Build and Push Docker Image to OCIR
        run: |
          IMAGE_TAG="${{ secrets.OCIR_REGION }}.ocir.io/${{ secrets.OCIR_TENANCY_NAMESPACE }}/${{ inputs.service-name }}:${{ github.sha }}"
          IMAGE_LATEST="${{ secrets.OCIR_REGION }}.ocir.io/${{ secrets.OCIR_TENANCY_NAMESPACE }}/${{ inputs.service-name }}:latest"

          echo "🏗️  Building Docker image..."
          docker build -t ${IMAGE_TAG} -t ${IMAGE_LATEST} .

          echo "📤 Pushing image to Oracle Container Registry..."
          docker push ${IMAGE_TAG}
          docker push ${IMAGE_LATEST}

          echo "✅ Image pushed successfully"

      - name: Run Database Migrations
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "🔄 Running database migrations..."

            # Clone or update repository to get latest migrations
            if [ ! -d ~/payment-service-repo ]; then
              git clone https://github.com/${{ github.repository }}.git ~/payment-service-repo
            else
              cd ~/payment-service-repo && git fetch origin && git reset --hard origin/${{ github.ref_name }}
            fi

            # Install goose if not present
            if ! command -v goose &> /dev/null; then
              echo "Installing goose..."
              curl -fsSL https://raw.githubusercontent.com/pressly/goose/master/install.sh | sh
              sudo mv goose /usr/local/bin/
            fi

            # Build PostgreSQL connection string
            DATABASE_URL="postgres://payment_service:${{ secrets.DB_PASSWORD }}@localhost:5432/payment_service?sslmode=disable"

            # Run migrations
            cd ~/payment-service-repo/internal/db/migrations
            echo "Running goose migrations..."
            goose -dir . postgres "$DATABASE_URL" up

            echo "✅ Migrations completed successfully"

      - name: Deploy to Oracle Compute Instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "🔐 Logging into Oracle Container Registry..."
            echo "${{ secrets.OCIR_AUTH_TOKEN }}" | sudo docker login ${{ secrets.OCIR_REGION }}.ocir.io \
              -u "${{ secrets.OCIR_USERNAME }}" \
              --password-stdin

            echo "📥 Pulling latest Docker image..."
            IMAGE_URL="${{ secrets.OCIR_REGION }}.ocir.io/${{ secrets.OCIR_TENANCY_NAMESPACE }}/${{ inputs.service-name }}:${{ inputs.image-tag }}"
            sudo docker pull "$IMAGE_URL"

            echo "🛑 Stopping and removing existing container..."
            sudo docker stop payment-server 2>/dev/null || true
            sudo docker rm payment-server 2>/dev/null || true

            echo "🚀 Starting new container..."
            sudo docker run -d \
              --name payment-server \
              --network payment-network \
              --restart unless-stopped \
              -p 8080:8080 \
              -p 8081:8081 \
              -e PORT=8080 \
              -e HTTP_PORT=8081 \
              -e DB_HOST=payment-db \
              -e DB_PORT=5432 \
              -e DB_USER=payment_service \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=payment_service \
              -e DB_SSLMODE=disable \
              -e EPX_SERVER_POST_URL=https://certapia.paygateway.com/cgi-bin/dbs/cert_sim.cgi \
              -e EPX_KEY_EXCHANGE_URL=https://certapia.paygateway.com/cgi-bin/dbs/cert_sim.cgi \
              -e EPX_BROWSER_POST_URL=https://certapia.paygateway.com/cgi-bin/dbs/cert_sim.cgi \
              -e EPX_TIMEOUT=30 \
              -e EPX_CUST_NBR=${{ secrets.EPX_CUST_NBR }} \
              -e EPX_MERCH_NBR=${{ secrets.EPX_MERCH_NBR }} \
              -e EPX_DBA_NBR=${{ secrets.EPX_DBA_NBR }} \
              -e EPX_TERMINAL_NBR=${{ secrets.EPX_TERMINAL_NBR }} \
              -e EPX_MAC=${{ secrets.EPX_MAC_STAGING }} \
              -e NORTH_API_URL=https://api.north.com \
              -e NORTH_TIMEOUT=30 \
              -e CRON_SECRET=${{ secrets.CRON_SECRET_STAGING }} \
              -e ENVIRONMENT=staging \
              -e SECRET_MANAGER=mock \
              -e SECRET_CACHE_TTL_MINUTES=5 \
              "$IMAGE_URL"

            echo "⏳ Waiting for service to start..."
            sleep 15

            echo "🏥 Checking health..."
            MAX_ATTEMPTS=30
            for i in $(seq 1 $MAX_ATTEMPTS); do
              if curl -f http://localhost:8081/cron/health 2>/dev/null; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/$MAX_ATTEMPTS - Service not ready yet, waiting 2s..."
              sleep 2
            done

            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            echo "Container logs:"
            sudo docker logs payment-server
            exit 1

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 5
          curl -f http://${{ inputs.oracle-cloud-host }}:8081/cron/health

          echo "✅ Staging deployment verified"
          echo "📍 Staging URL: http://${{ inputs.oracle-cloud-host }}:8081"
