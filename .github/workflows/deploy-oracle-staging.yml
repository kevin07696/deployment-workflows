name: Deploy to Oracle Cloud Staging

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: 'Name of the service to deploy'
      image-tag:
        required: false
        type: string
        default: 'latest'
        description: 'Docker image tag to deploy'
      oracle-cloud-host:
        required: true
        type: string
        description: 'Oracle Cloud host IP (from infrastructure output)'
      db-host:
        required: true
        type: string
        description: 'Database connection host (from infrastructure output)'
      db-port:
        required: true
        type: string
        description: 'Database connection port (from infrastructure output)'
      db-service-name:
        required: true
        type: string
        description: 'Database service name (from infrastructure output)'
      db-user:
        required: true
        type: string
        description: 'Database user (from infrastructure output)'
    secrets:
      ORACLE_CLOUD_SSH_KEY:
        required: true
      OCIR_REGION:
        required: true
      OCIR_TENANCY_NAMESPACE:
        required: true
      OCIR_USERNAME:
        required: true
      OCIR_AUTH_TOKEN:
        required: true
      ORACLE_DB_PASSWORD:
        required: true
      ORACLE_DB_ADMIN_PASSWORD:
        required: true
      EPX_MAC_STAGING:
        required: true
      EPX_CUST_NBR:
        required: true
      EPX_MERCH_NBR:
        required: true
      EPX_DBA_NBR:
        required: true
      EPX_TERMINAL_NBR:
        required: true

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for SSH to be ready
        run: |
          echo "⏳ Waiting for compute instance SSH to be ready..."
          max_attempts=30
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: Checking SSH connectivity..."

            if nc -z -w5 ${{ inputs.oracle-cloud-host }} 22 2>/dev/null; then
              echo "✅ SSH port is open!"
              # Give SSH daemon a few more seconds to fully initialize
              sleep 10
              echo "✅ SSH is ready for connections"
              exit 0
            fi

            echo "SSH not ready yet, waiting 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "❌ SSH did not become ready after $max_attempts attempts"
          exit 1

      - name: Download SSH Private Key
        uses: actions/download-artifact@v4
        with:
          name: oracle-ssh-key-staging
          path: .

      - name: Set SSH Key Permissions
        run: |
          chmod 600 oracle-staging-key
          ls -la oracle-staging-key

      - name: Wait for cloud-init to complete
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "⏳ Waiting for cloud-init to complete..."

            # Wait for cloud-init to finish (max 20 minutes)
            # Increased timeout to handle Docker installation and Oracle Instant Client
            if timeout 1200 cloud-init status --wait; then
              echo "✅ cloud-init completed successfully"
            else
              echo "❌ cloud-init failed or timed out!"
              echo ""
              echo "=== Cloud-init status ==="
              cloud-init status --long || true
              echo ""
              echo "=== Last 100 lines of cloud-init output ==="
              sudo tail -n 100 /var/log/cloud-init-output.log || true
              echo ""
              echo "=== Last 50 lines of cloud-init log ==="
              sudo tail -n 50 /var/log/cloud-init.log || true
              exit 1
            fi

            # Verify Docker is installed and working
            echo "🔍 Verifying Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker command not found!"
              echo "cloud-init may have failed to install Docker"
              sudo tail -n 100 /var/log/cloud-init-output.log || true
              exit 1
            fi

            if ! docker version &> /dev/null; then
              echo "❌ Docker installed but not working!"
              echo "Docker version check failed"
              sudo systemctl status docker || true
              exit 1
            fi

            echo "✅ Docker verified: $(docker --version)"

            # Verify docker compose plugin
            if docker compose version &> /dev/null; then
              echo "✅ Docker Compose plugin verified: $(docker compose version)"
            else
              echo "❌ Docker Compose plugin not available!"
              exit 1
            fi

            # Verify application directory exists
            if [ ! -d ~/payment-service ]; then
              echo "❌ Application directory not created by cloud-init"
              exit 1
            fi

            echo "✅ All verifications passed - instance ready for deployment"

      - name: Download Oracle Wallet
        uses: actions/download-artifact@v4
        with:
          name: oracle-wallet-staging
          path: .

      - name: Upload Oracle Wallet to Compute Instance
        uses: appleboy/scp-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          source: oracle-wallet.zip
          target: /home/ubuntu/

      - name: Install Oracle Wallet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "📦 Installing Oracle Wallet..."

            # Remove existing wallet directory if present
            rm -rf /home/ubuntu/oracle-wallet

            # Create wallet directory
            mkdir -p /home/ubuntu/oracle-wallet

            # Unzip wallet
            cd /home/ubuntu
            unzip -o oracle-wallet.zip -d /home/ubuntu/oracle-wallet/

            # Set proper ownership
            chown -R ubuntu:ubuntu /home/ubuntu/oracle-wallet

            # Set directory permissions (need execute to cd into it)
            chmod 755 /home/ubuntu/oracle-wallet

            # Set wallet file permissions (readable by owner)
            chmod 644 /home/ubuntu/oracle-wallet/*

            # Remove ZIP file for security
            rm -f /home/ubuntu/oracle-wallet.zip

            # Fix sqlnet.ora to use correct wallet path
            # Oracle wallets contain hardcoded paths that need to be updated
            echo "Updating sqlnet.ora with correct wallet location..."
            sed -i 's|WALLET_LOCATION = (SOURCE = (METHOD = file) (METHOD_DATA = (DIRECTORY="[^"]*")))|WALLET_LOCATION = (SOURCE = (METHOD = file) (METHOD_DATA = (DIRECTORY="/home/ubuntu/oracle-wallet")))|g' /home/ubuntu/oracle-wallet/sqlnet.ora

            echo "sqlnet.ora contents:"
            cat /home/ubuntu/oracle-wallet/sqlnet.ora

            # Verify wallet files exist
            echo "Wallet contents:"
            ls -la /home/ubuntu/oracle-wallet/

            # Verify required wallet files are present and not empty
            for file in cwallet.sso tnsnames.ora sqlnet.ora; do
              if [ ! -f /home/ubuntu/oracle-wallet/$file ]; then
                echo "❌ ERROR: $file not found!"
                exit 1
              fi

              if [ ! -s /home/ubuntu/oracle-wallet/$file ]; then
                echo "❌ ERROR: $file is empty!"
                exit 1
              fi
            done

            # Verify service name is in tnsnames.ora
            if ! grep -q "${{ inputs.db-service-name }}" /home/ubuntu/oracle-wallet/tnsnames.ora; then
              echo "❌ ERROR: Service name ${{ inputs.db-service-name }} not found in tnsnames.ora!"
              cat /home/ubuntu/oracle-wallet/tnsnames.ora
              exit 1
            fi

            echo "✅ Oracle Wallet installed and validated successfully"

      - name: Validate Oracle Wallet Connectivity
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "🔍 Testing Oracle Wallet connectivity..."

            # Set Oracle environment
            export LD_LIBRARY_PATH=/opt/oracle/instantclient_21_1:$LD_LIBRARY_PATH
            export PATH=/opt/oracle/instantclient_21_1:$PATH
            export TNS_ADMIN=/home/ubuntu/oracle-wallet

            # Test database connectivity with ADMIN user (this also validates TNS resolution)
            echo "Testing database connection and TNS resolution..."
            if ! echo "SELECT 'Connection successful' FROM DUAL;" | sqlplus -L -S ADMIN/${{ secrets.ORACLE_DB_ADMIN_PASSWORD }}@${{ inputs.db-service-name }}_high > /dev/null 2>&1; then
              echo "❌ ERROR: Cannot connect to database!"
              echo "Connection string: ADMIN/***@${{ inputs.db-service-name }}_high"
              exit 1
            fi

            echo "✅ Database connection successful"
            echo "✅ Oracle Wallet connectivity validated"

      - name: Download Database Init Script
        uses: actions/download-artifact@v4
        with:
          name: db-init-script-staging
          path: .

      - name: Upload Database Init Script to Compute Instance
        uses: appleboy/scp-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          source: init_db.sql
          target: /home/ubuntu/

      - name: Initialize Database User
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "👤 Initializing database user..."

            # Oracle Instant Client is pre-installed by cloud-init
            # Set Oracle environment variables
            export LD_LIBRARY_PATH=/opt/oracle/instantclient_21_1:$LD_LIBRARY_PATH
            export PATH=/opt/oracle/instantclient_21_1:$PATH
            export TNS_ADMIN=/home/ubuntu/oracle-wallet

            # Connect as ADMIN and run init script
            # Using ADMIN user to create application user
            ADMIN_CONN_STRING="ADMIN/${{ secrets.ORACLE_DB_ADMIN_PASSWORD }}@${{ inputs.db-service-name }}_high"

            echo "Creating application user if not exists..."
            sqlplus -S "$ADMIN_CONN_STRING" @/home/ubuntu/init_db.sql

            echo "✅ Database user initialized successfully"

      - name: Run Migrations via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "🔄 Running database migrations on Oracle Autonomous Database..."

            # Ensure migrations directory exists
            mkdir -p ~/migrations

            # Clone or update repository to get latest migrations
            if [ ! -d ~/payment-service-repo ]; then
              git clone https://github.com/${{ github.repository }}.git ~/payment-service-repo
            else
              cd ~/payment-service-repo && git pull origin ${{ github.ref_name }}
            fi

            # Copy migrations and seeds to local directories
            cp -r ~/payment-service-repo/internal/db/migrations/* ~/migrations/ 2>/dev/null || echo "No migrations to copy"

            # Copy seed data for staging
            mkdir -p ~/seeds
            cp -r ~/payment-service-repo/internal/db/seeds/staging/* ~/seeds/ 2>/dev/null || echo "No seeds to copy"

            # Oracle Instant Client is pre-installed by cloud-init
            # Set Oracle environment variables
            export LD_LIBRARY_PATH=/opt/oracle/instantclient_21_1:$LD_LIBRARY_PATH
            export PATH=/opt/oracle/instantclient_21_1:$PATH
            export TNS_ADMIN=/home/ubuntu/oracle-wallet

            # Build connection string for Oracle (not PostgreSQL!)
            # Oracle connection format: user/password@//host:port/service_name
            DB_CONN_STRING="${{ inputs.db-user }}/${{ secrets.ORACLE_DB_PASSWORD }}@${{ inputs.db-service-name }}_high"

            # Run migrations using SQL*Plus
            cd ~/migrations
            echo "Running migrations..."
            for migration_file in $(ls *.sql | sort); do
              echo "  - Applying migration: $migration_file"
              # Extract only the "Up" section from goose migration files
              sed -n '/-- +goose Up/,/-- +goose Down/p' "$migration_file" | \
                sed '/-- +goose Down/d' | \
                sqlplus -S "$DB_CONN_STRING" @/dev/stdin
            done

            echo "✅ Migrations completed successfully"

            # Run seed data for staging environment
            echo "🌱 Seeding staging database..."
            cd ~/seeds
            if [ -n "$(ls -A *.sql 2>/dev/null)" ]; then
              for seed_file in $(ls *.sql | sort); do
                echo "  - Applying seed: $seed_file"
                sqlplus -S "$DB_CONN_STRING" @"$seed_file"
              done
              echo "✅ Database seeding completed successfully"
            else
              echo "No seed files found, skipping seeding"
            fi

  deploy:
    name: Deploy Application
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Oracle Container Registry (OCIR)
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login ${{ secrets.OCIR_REGION }}.ocir.io \
            -u "${{ secrets.OCIR_USERNAME }}" \
            --password-stdin

      - name: Build and Push Docker Image to OCIR
        run: |
          IMAGE_TAG="${{ secrets.OCIR_REGION }}.ocir.io/${{ secrets.OCIR_TENANCY_NAMESPACE }}/${{ inputs.service-name }}:${{ github.sha }}"
          IMAGE_LATEST="${{ secrets.OCIR_REGION }}.ocir.io/${{ secrets.OCIR_TENANCY_NAMESPACE }}/${{ inputs.service-name }}:latest"

          echo "🏗️  Building Docker image..."
          docker build -t ${IMAGE_TAG} -t ${IMAGE_LATEST} .

          echo "📤 Pushing image to Oracle Container Registry..."
          docker push ${IMAGE_TAG}
          docker push ${IMAGE_LATEST}

          echo "✅ Image pushed successfully"

      - name: Download SSH Private Key
        uses: actions/download-artifact@v4
        with:
          name: oracle-ssh-key-staging
          path: .

      - name: Set SSH Key Permissions
        run: chmod 600 oracle-staging-key

      - name: Verify Environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "🔍 Verifying deployment environment..."

            # Ensure Docker is available
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker not available"
              exit 1
            fi

            # Ensure docker-compose is available
            if ! command -v docker-compose &> /dev/null; then
              echo "❌ docker-compose not available"
              exit 1
            fi

            echo "✅ Environment ready for deployment"

      - name: Deploy to Oracle Compute Instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.oracle-cloud-host }}
          username: ubuntu
          key_path: oracle-staging-key
          script: |
            echo "🔐 Logging into Oracle Container Registry..."
            echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login ${{ secrets.OCIR_REGION }}.ocir.io \
              -u "${{ secrets.OCIR_USERNAME }}" \
              --password-stdin

            echo "📥 Pulling latest Docker image..."
            IMAGE_URL="${{ secrets.OCIR_REGION }}.ocir.io/${{ secrets.OCIR_TENANCY_NAMESPACE }}/${{ inputs.service-name }}:${{ inputs.image-tag }}"
            docker pull "$IMAGE_URL"

            echo "🛑 Stopping and removing existing container..."
            docker stop payment-server 2>/dev/null || true
            docker rm payment-server 2>/dev/null || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name payment-server \
              --restart unless-stopped \
              -p 8080:8080 \
              -p 8081:8081 \
              -e PORT=8080 \
              -e HTTP_PORT=8081 \
              -e DB_HOST=${{ inputs.db-host }} \
              -e DB_PORT=${{ inputs.db-port }} \
              -e DB_USER=${{ inputs.db-user }} \
              -e DB_PASSWORD=${{ secrets.ORACLE_DB_PASSWORD }} \
              -e DB_NAME=ADMIN \
              -e DB_SERVICE_NAME=${{ inputs.db-service-name }}_high \
              -e EPX_SERVER_POST_URL=https://certapia.paygateway.com/cgi-bin/dbs/cert_sim.cgi \
              -e EPX_KEY_EXCHANGE_URL=https://certapia.paygateway.com/cgi-bin/dbs/cert_sim.cgi \
              -e EPX_BROWSER_POST_URL=https://certapia.paygateway.com/cgi-bin/dbs/cert_sim.cgi \
              -e EPX_TIMEOUT=30 \
              -e EPX_CUST_NBR=${{ secrets.EPX_CUST_NBR }} \
              -e EPX_MERCH_NBR=${{ secrets.EPX_MERCH_NBR }} \
              -e EPX_DBA_NBR=${{ secrets.EPX_DBA_NBR }} \
              -e EPX_TERMINAL_NBR=${{ secrets.EPX_TERMINAL_NBR }} \
              -e EPX_MAC=${{ secrets.EPX_MAC_STAGING }} \
              -e NORTH_API_URL=https://api.north.com \
              -e NORTH_TIMEOUT=30 \
              -e CRON_SECRET=staging-cron-secret \
              -e ENVIRONMENT=staging \
              -e SECRET_MANAGER=mock \
              -e SECRET_CACHE_TTL_MINUTES=5 \
              "$IMAGE_URL"

            echo "⏳ Waiting for service to start..."
            sleep 15

            echo "🏥 Checking health..."
            MAX_ATTEMPTS=30
            for i in $(seq 1 $MAX_ATTEMPTS); do
              if curl -f http://localhost:8081/cron/health 2>/dev/null; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/$MAX_ATTEMPTS - Service not ready yet, waiting 2s..."
              sleep 2
            done

            echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
            echo "Container logs:"
            docker logs payment-server
            exit 1

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployment..."
          sleep 5
          curl -f http://${{ inputs.oracle-cloud-host }}:8081/cron/health

          echo "✅ Staging deployment verified"
          echo "📍 Staging URL: http://${{ inputs.oracle-cloud-host }}:8081"
