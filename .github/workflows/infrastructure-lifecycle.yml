name: Infrastructure Lifecycle Management

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
        description: 'Action to perform: create, destroy, or check'
      environment:
        required: true
        type: string
        description: 'Environment (staging or production)'
      terraform-directory:
        required: false
        type: string
        default: 'deployment-workflows/terraform/oracle-staging'
        description: 'Terraform directory in deployment-workflows repo'
    secrets:
      OCI_USER_OCID:
        required: true
      OCI_TENANCY_OCID:
        required: true
      OCI_COMPARTMENT_OCID:
        required: true
      OCI_REGION:
        required: true
      OCI_FINGERPRINT:
        required: true
      OCI_PRIVATE_KEY:
        required: true
      DB_PASSWORD:
        required: true
      EPX_MAC_STAGING:
        required: true
      CRON_SECRET_STAGING:
        required: true
      SSH_PUBLIC_KEY:
        required: false
      OCIR_REGION:
        required: true
      OCIR_TENANCY_NAMESPACE:
        required: true
      OCIR_USERNAME:
        required: true
      OCIR_AUTH_TOKEN:
        required: true
    outputs:
      infrastructure_exists:
        description: 'Whether infrastructure exists'
        value: ${{ jobs.manage.outputs.infrastructure_exists }}
      oracle_cloud_host:
        description: 'Oracle Cloud host IP'
        value: ${{ jobs.manage.outputs.oracle_cloud_host }}
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - create
          - destroy
          - check
        description: 'Action to perform: create, destroy, or check'
      environment:
        required: true
        type: choice
        options:
          - staging
          - production
        description: 'Environment (staging or production)'
      terraform-directory:
        required: false
        type: string
        default: 'deployment-workflows/terraform/oracle-staging'
        description: 'Terraform directory in deployment-workflows repo'

jobs:
  manage:
    name: ${{ inputs.action }} Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      infrastructure_exists: ${{ steps.check.outputs.exists }}
      oracle_cloud_host: ${{ steps.output.outputs.host }}

    steps:
      - name: Checkout deployment-workflows (for terraform)
        uses: actions/checkout@v4
        with:
          repository: kevin07696/deployment-workflows
          ref: fix/ssh-connectivity-debugging
          path: deployment-workflows

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'
          terraform_wrapper: false

      - name: Configure Oracle Cloud credentials
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Mask Sensitive Values
        run: |
          echo "🔒 Masking sensitive values in logs..."
          echo "::add-mask::${{ secrets.DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.EPX_MAC_STAGING }}"
          echo "::add-mask::${{ secrets.CRON_SECRET_STAGING }}"
          echo "::add-mask::${{ secrets.OCI_PRIVATE_KEY }}"
          echo "::add-mask::${{ secrets.OCI_FINGERPRINT }}"
          echo "::add-mask::${{ secrets.OCIR_USERNAME }}"
          echo "::add-mask::${{ secrets.OCIR_AUTH_TOKEN }}"
          echo "✅ Sensitive values masked"

      - name: Pre-flight Resource Quota Check
        if: inputs.action == 'create'
        run: |
          echo "🔍 Pre-flight resource quota check..."

          # Install OCI CLI if needed
          if ! command -v oci &> /dev/null; then
            bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
            echo "$HOME/bin" >> $GITHUB_PATH
            export PATH="$HOME/bin:$PATH"
          fi

          # Check VCN quota (Oracle Free Tier: 2)
          VCN_COUNT=$($HOME/bin/oci network vcn list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
            --all | jq '[.data[]?] | length')

          echo "Current VCN count: $VCN_COUNT (Free Tier limit: 2)"

          # Check Compute quota
          INSTANCE_COUNT=$($HOME/bin/oci compute instance list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
            --lifecycle-state RUNNING \
            --all | \
            jq '([.data[]?] | length) // 0')

          echo "Current running instance count: $INSTANCE_COUNT (Free Tier limit: 2)"

          echo "✅ Pre-flight quota check complete"

      - name: Cleanup Orphaned VCNs
        if: inputs.action == 'create'
        run: |
          echo "🧹 Checking for orphaned VCNs..."

          # Get all VCNs with payment prefix
          VCN_IDS=$($HOME/bin/oci network vcn list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
            --all | jq -r '.data[]? | select(."display-name" | contains("payment-${{ inputs.environment }}")) | .id')

          VCN_COUNT=$(echo "$VCN_IDS" | grep -c . || echo "0")
          echo "Found $VCN_COUNT orphaned VCN(s)"

          if [ "$VCN_COUNT" -gt 0 ]; then
            echo "🧹 Cleaning up orphaned VCNs..."

            for vcn_id in $VCN_IDS; do
              echo "Processing VCN: $vcn_id"

              # Delete subnets
              for subnet in $($HOME/bin/oci network subnet list --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} --vcn-id "$vcn_id" --all 2>/dev/null | jq -r '.data[]?.id' || true); do
                $HOME/bin/oci network subnet delete --subnet-id "$subnet" --force 2>/dev/null || true
              done

              # Delete internet gateways
              for igw in $($HOME/bin/oci network internet-gateway list --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} --vcn-id "$vcn_id" --all 2>/dev/null | jq -r '.data[]?.id' || true); do
                $HOME/bin/oci network internet-gateway delete --ig-id "$igw" --force 2>/dev/null || true
              done

              # Delete NAT gateways
              for nat in $($HOME/bin/oci network nat-gateway list --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} --vcn-id "$vcn_id" --all 2>/dev/null | jq -r '.data[]?.id' || true); do
                $HOME/bin/oci network nat-gateway delete --nat-gateway-id "$nat" --force 2>/dev/null || true
              done

              # Clear route tables
              for rt in $($HOME/bin/oci network route-table list --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} --vcn-id "$vcn_id" --all 2>/dev/null | jq -r '.data[]?.id' || true); do
                $HOME/bin/oci network route-table update --rt-id "$rt" --route-rules '[]' --force 2>/dev/null || true
              done

              # Delete non-default security lists
              for sl in $($HOME/bin/oci network security-list list --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} --vcn-id "$vcn_id" --all 2>/dev/null | jq -r '.data[]?.id' || true); do
                $HOME/bin/oci network security-list delete --security-list-id "$sl" --force 2>/dev/null || true
              done

              sleep 5
              $HOME/bin/oci network vcn delete --vcn-id "$vcn_id" --force 2>/dev/null && echo "  ✅ VCN deleted" || echo "  ⚠️ VCN deletion failed"
            done

            sleep 30
          fi

          echo "✅ VCN cleanup complete"

      - name: Cleanup Orphaned Compute Instances
        if: inputs.action == 'create'
        run: |
          echo "🧹 Checking for orphaned compute instances..."

          INSTANCE_COUNT=$($HOME/bin/oci compute instance list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
            --lifecycle-state RUNNING \
            --all | \
            jq '([.data[]? | select(."display-name" | contains("payment-${{ inputs.environment }}"))] | length) // 0')

          echo "Found $INSTANCE_COUNT orphaned instance(s)"

          if [ "$INSTANCE_COUNT" -gt 0 ]; then
            echo "🧹 Cleaning up orphaned compute instances..."
            $HOME/bin/oci compute instance list \
              --compartment-id ${{ secrets.OCI_COMPARTMENT_OCID }} \
              --lifecycle-state RUNNING \
              --all | \
              jq -r '.data[] | select(."display-name" | contains("payment-${{ inputs.environment }}")) | .id' | \
              while read instance_id; do
                echo "  Terminating instance: $instance_id"
                $HOME/bin/oci compute instance terminate --instance-id "$instance_id" --force || true
            done
            sleep 30
          fi

          echo "✅ Compute cleanup complete"

      - name: Restore Terraform State
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.terraform-directory }}/terraform.tfstate
          key: terraform-state-${{ inputs.environment }}

      - name: Terraform Init
        working-directory: ${{ inputs.terraform-directory }}
        run: terraform init

      - name: Check Infrastructure State
        id: check
        working-directory: ${{ inputs.terraform-directory }}
        run: |
          if terraform show &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Infrastructure exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Infrastructure does not exist"
          fi

      - name: Terraform Plan
        if: inputs.action == 'create' || inputs.action == 'check'
        working-directory: ${{ inputs.terraform-directory }}
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > plan.txt
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_db_app_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_epx_mac: ${{ secrets.EPX_MAC_STAGING }}
          TF_VAR_cron_secret: ${{ secrets.CRON_SECRET_STAGING }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_ocir_region: ${{ secrets.OCIR_REGION }}
          TF_VAR_ocir_namespace: ${{ secrets.OCIR_TENANCY_NAMESPACE }}
          TF_VAR_ocir_username: ${{ secrets.OCIR_USERNAME }}
          TF_VAR_ocir_auth_token: ${{ secrets.OCIR_AUTH_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Upload Plan
        if: inputs.action == 'create' || inputs.action == 'check'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ inputs.terraform-directory }}/plan.txt

      - name: Terraform Apply
        if: inputs.action == 'create'
        working-directory: ${{ inputs.terraform-directory }}
        run: |
          echo "🚀 Creating ${{ inputs.environment }} infrastructure..."
          terraform apply -auto-approve tfplan
          echo "✅ Infrastructure created successfully"
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_db_app_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_epx_mac: ${{ secrets.EPX_MAC_STAGING }}
          TF_VAR_cron_secret: ${{ secrets.CRON_SECRET_STAGING }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_ocir_region: ${{ secrets.OCIR_REGION }}
          TF_VAR_ocir_namespace: ${{ secrets.OCIR_TENANCY_NAMESPACE }}
          TF_VAR_ocir_username: ${{ secrets.OCIR_USERNAME }}
          TF_VAR_ocir_auth_token: ${{ secrets.OCIR_AUTH_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ inputs.terraform-directory }}
        run: |
          echo "🗑️ Destroying ${{ inputs.environment }} infrastructure..."
          terraform destroy -auto-approve || true
          echo "✅ Infrastructure destroyed"
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_db_app_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_epx_mac: ${{ secrets.EPX_MAC_STAGING }}
          TF_VAR_cron_secret: ${{ secrets.CRON_SECRET_STAGING }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_ocir_region: ${{ secrets.OCIR_REGION }}
          TF_VAR_ocir_namespace: ${{ secrets.OCIR_TENANCY_NAMESPACE }}
          TF_VAR_ocir_username: ${{ secrets.OCIR_USERNAME }}
          TF_VAR_ocir_auth_token: ${{ secrets.OCIR_AUTH_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Export Outputs
        id: output
        if: inputs.action == 'create' && success()
        working-directory: ${{ inputs.terraform-directory }}
        run: |
          echo "Extracting Terraform outputs..."

          ORACLE_HOST=$(terraform output -raw oracle_cloud_host 2>/dev/null || echo "")
          echo "host=${ORACLE_HOST}" >> $GITHUB_OUTPUT

          echo "## Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Oracle Cloud Host:** ${ORACLE_HOST}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Validate Terraform Outputs
        if: inputs.action == 'create' && success()
        working-directory: ${{ inputs.terraform-directory }}
        run: |
          echo "🔍 Validating Terraform outputs..."

          ORACLE_HOST=$(terraform output -raw oracle_cloud_host 2>/dev/null || echo "")
          echo "oracle_cloud_host: $ORACLE_HOST"

          # Validate oracle_cloud_host is not empty
          if [ -z "$ORACLE_HOST" ]; then
            echo "❌ ERROR: oracle_cloud_host output is empty!"
            terraform output
            exit 1
          fi

          # Validate IP format
          if ! echo "$ORACLE_HOST" | grep -E '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "❌ ERROR: oracle_cloud_host is not a valid IP: $ORACLE_HOST"
            exit 1
          fi

          # Test network connectivity
          echo "Testing network connectivity to $ORACLE_HOST..."
          if ping -c 3 -W 5 "$ORACLE_HOST" > /dev/null 2>&1; then
            echo "✅ ICMP: Instance is reachable"
          else
            echo "⚠️ WARNING: Cannot ping $ORACLE_HOST (may be normal if ICMP blocked)"
          fi

          echo "✅ All critical outputs validated successfully"

      - name: Save SSH Private Key
        if: inputs.action == 'create' && success()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-ssh-key-${{ inputs.environment }}
          path: ${{ inputs.terraform-directory }}/oracle-staging-key
          retention-days: 7

      - name: Save Terraform State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.terraform-directory }}/terraform.tfstate
          key: terraform-state-${{ inputs.environment }}

      - name: Generate Summary
        if: always()
        run: |
          echo "## Infrastructure ${{ inputs.action }} - ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
