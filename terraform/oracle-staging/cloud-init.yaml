#cloud-config

# Oracle Cloud Compute Instance Setup
# Bootstrap Docker with PostgreSQL and application services
# NOTE: Using PostgreSQL container since application uses pgx/v5 driver

# Skip full system upgrade (very slow) - only install essentials
package_update: false
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - jq

write_files:
  # Application environment config
  # NOTE: Using defer:true because ubuntu user is created during cloud-init boot
  # and isn't available when write_files runs in early boot stages
  - path: /home/ubuntu/payment-service/.env
    permissions: '0600'
    owner: ubuntu:ubuntu
    defer: true
    content: |
      # Environment
      ENVIRONMENT=${environment}

      # Database (PostgreSQL container on localhost)
      DB_HOST=localhost
      DB_PORT=5432
      DB_USER=payment_service
      DB_PASSWORD=${db_password}
      DB_NAME=payment_service
      DB_SSLMODE=disable

      # Server
      PORT=8080
      HTTP_PORT=8081

      # EPX Payment Gateway
      EPX_SERVER_POST_URL=https://secure.epxuap.com
      EPX_TIMEOUT=30
      EPX_TEST_AGENT_MAC=${epx_mac}

      # Cron Security
      CRON_SECRET=${cron_secret}

      # Logging
      LOG_LEVEL=info

  # Message of the Day
  - path: /etc/motd
    content: |
      ==========================================
      Payment Service - ${environment}
      ==========================================
      App:    /home/ubuntu/payment-service
      Logs:   sudo docker logs payment-server -f
      DB:     sudo docker logs payment-db -f
      ==========================================
    owner: root:root
    permissions: '0644'

runcmd:
  # Create directories
  - mkdir -p /home/ubuntu/payment-service
  - chown -R ubuntu:ubuntu /home/ubuntu/payment-service

  # Configure firewall (minimal)
  - ufw allow 22/tcp
  - ufw allow 8080/tcp
  - ufw allow 8081/tcp
  - ufw allow 5432/tcp  # PostgreSQL - for integration tests from GitHub Actions
  - ufw --force enable

  # Install Docker via snap (fast, pre-packaged)
  - snap install docker
  - snap start docker

  # Wait for Docker to be ready (max 60 seconds)
  - |
    for i in $(seq 1 12); do
      if docker version > /dev/null 2>&1; then
        echo "✅ Docker ready"
        break
      fi
      echo "Waiting for Docker... ($i/12)"
      sleep 5
    done

  # Create Docker network for service communication
  - sudo docker network create payment-network 2>/dev/null || true

  # Start PostgreSQL container
  - |
    echo "Starting PostgreSQL container..."
    sudo docker run -d \
      --name payment-db \
      --network payment-network \
      --restart unless-stopped \
      -e POSTGRES_USER=payment_service \
      -e POSTGRES_PASSWORD=${db_password} \
      -e POSTGRES_DB=payment_service \
      -v /home/ubuntu/payment-service/pgdata:/var/lib/postgresql/data \
      -p 5432:5432 \
      postgres:15-alpine

  # Wait for PostgreSQL to be ready
  - |
    echo "Waiting for PostgreSQL to be ready..."
    for i in $(seq 1 30); do
      if sudo docker exec payment-db pg_isready -U payment_service > /dev/null 2>&1; then
        echo "✅ PostgreSQL ready"
        break
      fi
      echo "Waiting for PostgreSQL... ($i/30)"
      sleep 2
    done

  # With snap Docker, use sudo for docker commands (no docker group)
  # OCIR login (non-fatal if fails)
  # NOTE: Using echo | pipe instead of <<< (here-string) for POSIX sh compatibility
  - |
    echo "${ocir_auth_token}" | sudo docker login ${ocir_region}.ocir.io -u "${ocir_username}" --password-stdin || echo "OCIR login failed (non-fatal)"

final_message: "Payment service instance ready! ${environment} environment with PostgreSQL."
