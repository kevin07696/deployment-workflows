#cloud-config

# Oracle Cloud Compute Instance Setup - SIMPLIFIED
# Minimal bootstrap - Docker and app setup only
# Removed: package_upgrade, Oracle Instant Client (not needed - DB access via Docker)

# Skip full system upgrade (very slow) - only install essentials
package_update: false
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - jq

write_files:
  # Application environment config
  - path: /home/ubuntu/payment-service/.env
    permissions: '0600'
    owner: ubuntu:ubuntu
    content: |
      # Environment
      ENVIRONMENT=${environment}

      # Database (PostgreSQL on Oracle - see DB_HOST for connection)
      DB_HOST=${db_connection_string}
      DB_PORT=1522
      DB_USER=${db_user}
      DB_PASSWORD=${db_password}
      DB_NAME=paymentdb
      DB_SSLMODE=require

      # Server
      PORT=8080
      HTTP_PORT=8081

      # EPX Payment Gateway
      EPX_SERVER_POST_URL=https://secure.epxuap.com
      EPX_TIMEOUT=30
      EPX_TEST_AGENT_MAC=${epx_mac}

      # Cron Security
      CRON_SECRET=${cron_secret}

      # Logging
      LOG_LEVEL=info

  # Message of the Day
  - path: /etc/motd
    content: |
      ==========================================
      Payment Service - ${environment}
      ==========================================
      App:    /home/ubuntu/payment-service
      Logs:   sudo docker logs payment-server -f
      ==========================================
    owner: root:root
    permissions: '0644'

runcmd:
  # Create directories
  - mkdir -p /home/ubuntu/payment-service
  - chown -R ubuntu:ubuntu /home/ubuntu/payment-service

  # Configure firewall (minimal)
  - ufw allow 22/tcp
  - ufw allow 8080/tcp
  - ufw allow 8081/tcp
  - ufw --force enable

  # Install Docker via snap (fast, pre-packaged)
  - snap install docker
  - snap start docker

  # Wait for Docker to be ready (max 60 seconds)
  - |
    for i in $(seq 1 12); do
      if docker version > /dev/null 2>&1; then
        echo "✅ Docker ready"
        break
      fi
      echo "Waiting for Docker... ($i/12)"
      sleep 5
    done

  # With snap Docker, use sudo for docker commands (no docker group)
  # OCIR login (non-fatal if fails)
  # NOTE: Using echo | pipe instead of <<< (here-string) for POSIX sh compatibility
  - |
    echo "${ocir_auth_token}" | sudo docker login ${ocir_region}.ocir.io -u "${ocir_username}" --password-stdin || echo "OCIR login failed (non-fatal)"

final_message: "Payment service instance ready! ${environment} environment."
